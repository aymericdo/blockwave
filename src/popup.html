<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Blockwave</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="head">
      <div class="mark" aria-hidden="true"></div>
      <div>
        <h1>Blockwave</h1>
        <p class="tagline">Nettoyage de feed, en un clic.</p>
      </div>
    </header>

    <div id="warning" class="warning" hidden></div>

    <button id="start" class="primary">Bloquer les comptes</button>

    <div class="meta">
      <span id="source">liste…</span>
      <span class="meta-actions">
        <button id="recheck" class="link" type="button" hidden>Revérifier</button>
        <button id="refresh" class="link" type="button">Actualiser</button>
      </span>
    </div>

    <form id="add-form" class="add" autocomplete="off">
      <input
        id="add-input"
        type="text"
        placeholder="@pseudo ou URL du profil"
        spellcheck="false"
        aria-label="Compte à ajouter"
      />
      <button id="add-submit" type="submit" class="add-btn" aria-label="Ajouter">+</button>
    </form>

    <p id="add-message" class="add-message" hidden></p>

    <button id="reset" class="ghost" hidden>Réinitialiser</button>

    <ul id="list" class="list"></ul>

    <p id="status" class="status">Prêt.</p>

    <script type="module" src="popup.js"></script>
  </body>
</html>
