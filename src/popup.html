<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Blockwave</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="head">
      <div class="mark" aria-hidden="true"></div>
      <div>
        <h1>Blockwave</h1>
        <p class="tagline">Nettoyage de feed, en un clic.</p>
      </div>
    </header>

    <div id="warning" class="warning" hidden></div>

    <button id="start" class="primary">Bloquer les comptes</button>

    <div class="meta">
      <span id="source">liste…</span>
      <button id="refresh" class="link" type="button">Actualiser</button>
    </div>

    <button id="reset" class="ghost" hidden>Réinitialiser</button>

    <ul id="list" class="list"></ul>

    <p id="status" class="status">Prêt.</p>

    <script type="module" src="popup.js"></script>
  </body>
</html>
