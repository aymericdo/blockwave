<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Blockwave — modération</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="shell wide">
      <header class="head">
        <div class="mark" aria-hidden="true"></div>
        <div>
          <h1>Blockwave · modération</h1>
          <p class="tagline">Valider ou rejeter les comptes proposés.</p>
        </div>
      </header>

      <div id="warning" class="warning" hidden></div>

      <!-- Connexion -->
      <section class="card" id="login">
        <h2>Connexion</h2>
        <p class="hint">
          Reçois un lien de connexion par e-mail. Seules les adresses présentes
          dans la table <code>admins</code> ont accès à cette page.
        </p>

        <form id="login-form">
          <label for="email">Adresse e-mail</label>
          <input id="email" type="email" autocomplete="email" placeholder="toi@exemple.com" />
          <button type="submit" class="primary" id="login-submit">Recevoir le lien</button>
        </form>

        <p id="login-message" class="success" hidden></p>
      </section>

      <!-- Console -->
      <section id="dashboard" hidden>
        <div class="toolbar">
          <span class="who" id="who"></span>
          <button class="ghost" id="signout">Se déconnecter</button>
        </div>

        <div class="tabs" role="tablist">
          <button class="tab" role="tab" data-tab="pending" aria-selected="true">
            En attente <span id="count-pending"></span>
          </button>
          <button class="tab" role="tab" data-tab="approved" aria-selected="false">
            Approuvés <span id="count-approved"></span>
          </button>
          <button class="tab" role="tab" data-tab="rejected" aria-selected="false">
            Rejetés <span id="count-rejected"></span>
          </button>
        </div>

        <ul class="queue" id="queue"></ul>
        <p class="empty" id="empty" hidden>Aucun compte dans cet onglet.</p>
      </section>
    </main>

    <script type="module" src="admin.js"></script>
  </body>
</html>
